#dataset config
dataset:
  airfoil_2d:
    data_dir: None
    input_features: ["x", "y", "nx", "ny"]
    output_features: ["P", "tau_x", "tau_y", "T"]
    invar_keys: ["pos", "normals", "edge_index", "y", "airfoil_name"]
    var_keys: ["mach", "alpha"]
    mach: [0.3, 2]
    alpha: [-10, 10]

  ahmed_body:
    data_dir: None
    input_features: ["x", "y", "z", "nx", "ny", "nz"]
    output_features: ["P", "tau_x", "tau_y", "tau_z"]
    invar_keys: ["velocity", "pos", "normals", "edge_index", "y", "case_no"]
    var_keys: ["Length", "Height", "Width", "Slant_angle", "Ground_clearance", "FilletRadius", "Velocity", "Re (based on length)"]
    # Note: ahmed_body dataset is pre-split into train/validation/test directories

  missile_3d1:
    data_dir: None
    input_features: ["x", "y", "z", "nx", "ny", "nz"]
    output_features: ["P", "tau_x", "tau_y", "tau_z", "T"]
    invar_keys: ["pos", "normals", "edge_index", "y", "design_no"]
    var_keys: ["mach", "alpha", "beta"]
    mach: [0.85]
    alpha: [0]
    beta: [0]

# Model configuration
model:

  mlpnet:
    num_hidden_layers_encoder: 3
    hidden_dim: 128
    num_hidden_layers_decoder: 3
    dropout: 0.0
    activation: "relu"

  meshgraphnet:
    processor_size: 15
    activation_fn: "relu"
    hidden_dim: 128
    aggregation: "add"
    num_hidden_layers_decoder: 2
    num_hidden_layers_node_encoder: 2
    num_hidden_layers_edge_encoder: 2
    num_hidden_layers_node_processor: 2
    num_hidden_layers_edge_processor: 2
    dropout: 0.0
    do_concat_trick: False

  fouriermgn:
    processor_size: 15
    activation_fn: "relu"
    hidden_dim: 128
    aggregation: "add"
    num_hidden_layers_decoder: 2
    num_hidden_layers_node_encoder: 2
    num_hidden_layers_edge_encoder: 2
    num_hidden_layers_node_processor: 2
    num_hidden_layers_edge_processor: 2
    dropout: 0.0
    fourier_features_dim: 2
    fourier_freq_start: -3
    fourier_freq_length: 7
    
  poolMGN:
    processor_size: 15
    activation_fn: "relu"
    hidden_dim: 128
    aggregation: "add"
    num_hidden_layers_decoder: 2
    num_hidden_layers_node_encoder: 2
    num_hidden_layers_edge_encoder: 2
    num_hidden_layers_node_processor: 2
    num_hidden_layers_edge_processor: 2
    global_pool_method: "mean"  # options: "mean", "max", "sum"
    num_hidden_layers_global_encoder: 2
    global_dim: 128
    dropout: 0.0

  trial1:
    number_of_encoding_layers: 3
    num_message_passing_layers: 15
    number_of_decoding_layers: 2
    hidden_dim: 128
    dropout: 0.0
    activation: "relu"

  bsms_mgn:
    num_levels: 3  # Number of coarsening levels
    hidden_dim: 128
    num_hidden_layers_encoder: 2
    num_hidden_layers_decoder: 2
    activation_fn: "relu"
    dropout: 0.0

  transolver:
    n_layers: 6  # Number of transformer blocks
    n_hidden: 256  # Hidden dimension
    n_head: 8  # Number of attention heads
    dropout: 0.0
    act: "gelu"  # Activation function (gelu recommended for transformers)
    mlp_ratio: 4  # MLP expansion ratio (4x is standard)
    slice_num: 32  # Number of eidetic states (16-64 range)
    use_checkpoint: True  # Gradient checkpointing to save memory
    fourier_features: False  # Apply Fourier encoding to positions
    fourier_dim: 0  # Dimension of Fourier features (if enabled)
    condition_dim: 0  # Dimension of global condition vector

  mgntransolver:
    processor_size: 6  # Number of MGN+Transolver block pairs
    message_passing_per_processor: 1  # Number of MGN layers per block
    activation_fn: "gelu"  # Activation for MGN layers
    hidden_dim: 256  # Hidden dimension for all components
    num_hidden_layers_node_processor: 1
    num_hidden_layers_edge_processor: 1
    num_hidden_layers_node_encoder: 1
    num_hidden_layers_edge_encoder: 1
    num_hidden_layers_decoder: 1
    aggregation: "add"  # Aggregation method for message passing
    dropout: 0.0
    do_concat_trick: True  # Whether to concatenate initial features before decoding
    n_head: 8  # Number of attention heads in Transolver
    slice_num: 32  # Number of eidetic states in Transolver (16-64 range)
    act: "gelu"  # Activation function for Transolver (gelu recommended for transformers)
    mlp_ratio: 4  # MLP expansion ratio for Transolver (4x is standard)
    use_checkpoint: True  # Gradient checkpointing to save memory

  gcn:
    processor_size: 15  # Number of GCN layers
    activation_fn: "relu"
    hidden_dim: 128
    num_hidden_layers_node_encoder: 1
    num_hidden_layers_decoder: 1
    dropout: 0.0

  gcntransolver:
    processor_size: 6  # Number of GCN+Transolver block pairs
    gcn_per_processor: 1  # Number of GCN layers per block
    activation_fn: "gelu"  # Activation for GCN layers
    hidden_dim: 256  # Hidden dimension for all components
    num_hidden_layers_node_encoder: 1
    num_hidden_layers_decoder: 1
    dropout: 0.0
    n_head: 8  # Number of attention heads in Transolver
    slice_num: 32  # Number of eidetic states in Transolver (16-64 range)
    act: "gelu"  # Activation function for Transolver (gelu recommended for transformers)
    mlp_ratio: 4  # MLP expansion ratio for Transolver (4x is standard)
    use_checkpoint: True  # Gradient checkpointing to save memory
    use_layer_norm: True  # Use layer normalization in GCN blocks

  poolmgntransolver:
    processor_size: 6  # Number of MGN+Transolver block pairs
    message_passing_per_processor: 1  # Number of MGN layers per block
    activation_fn: "gelu"  # Activation for MGN layers
    hidden_dim: 256  # Hidden dimension for all components
    num_hidden_layers_node_processor: 1
    num_hidden_layers_edge_processor: 1
    num_hidden_layers_node_encoder: 1
    num_hidden_layers_edge_encoder: 1
    num_hidden_layers_decoder: 1
    aggregation: "add"  # Aggregation method for message passing
    dropout: 0.0
    do_concat_trick: True  # Whether to concatenate initial features before decoding
    n_head: 8  # Number of attention heads in Transolver
    slice_num: 32  # Number of eidetic states in Transolver (16-64 range)
    act: "gelu"  # Activation function for Transolver (gelu recommended for transformers)
    mlp_ratio: 4  # MLP expansion ratio for Transolver (4x is standard)
    use_checkpoint: True  # Gradient checkpointing to save memory
    global_pool_method: "mean"  # Global pooling method: "mean", "max", or "add"
    num_hidden_layers_global_encoder: 1  # Number of layers in global encoder
    global_dim: 256  # Dimension of global pooled features

  fouriermgntransolver:
    processor_size: 6  # Number of MGN+Transolver block pairs
    message_passing_per_processor: 1  # Number of MGN layers per block
    activation_fn: "gelu"  # Activation for MGN layers
    hidden_dim: 256  # Hidden dimension for all components
    num_hidden_layers_node_processor: 1
    num_hidden_layers_edge_processor: 1
    num_hidden_layers_node_encoder: 1
    num_hidden_layers_edge_encoder: 1
    num_hidden_layers_decoder: 1
    aggregation: "add"  # Aggregation method for message passing
    dropout: 0.0
    do_concat_trick: True  # Whether to concatenate initial features before decoding
    n_head: 8  # Number of attention heads in Transolver
    slice_num: 32  # Number of eidetic states in Transolver (16-64 range)
    act: "gelu"  # Activation function for Transolver (gelu recommended for transformers)
    mlp_ratio: 4  # MLP expansion ratio for Transolver (4x is standard)
    use_checkpoint: True  # Gradient checkpointing to save memory
    fourier_features_dim: 2  # Number of spatial dimensions to apply Fourier encoding (2 for 2D, 3 for 3D)
    fourier_freq_start: -3  # Starting frequency index (2^-3)
    fourier_freq_length: 7  # Number of frequencies to use


# Training configuration
training:
  default:
    batch_size: 32
    epochs: 50
    learning_rate: 0.001
    optimizer: "AdamW"  # options: "Adam", "AdamW"
    scheduler: "ExponentialLR"  # options: "ExponentialLR", "ReduceLROnPlateau", "CosineAnnealingLR", "CosineAnnealingWarmRestarts", "Warmup"
    warmup_steps: 100
    lr_scheduler_exp_gamma: 0.9985
    lr_scheduler_step_size: 50
    lr_scheduler_gamma: 0.8
    lr_scheduler_T_0: 10
    weight_decay: 0.0
    validation_split: 0.1  
    test_split: 0.1        
    train_num_samples: None
    val_num_samples: None
    test_num_samples: None
    shuffle: True
    random_seed: 42
    precision: "bfloat16"  # options: "single", "double", "bfloat16"
    device: "cuda"
    loss_function: "MSELoss"
    early_stopping: True
    patience: 200
    reordering: "None"  # options: "None", "rcm", "GPS"
    # Profiling settings
    profiling: False  # Set to True to enable PyTorch profiler
    profile_epochs: 1  # Number of epochs to profile (profiles early epochs)
    profile_wait: 3  # Warm-up epochs before profiling
    profile_warmup: 3  # Number of warmup steps in profiling
    profile_active: 3  # Number of active profiling steps per epoch
    profile_repeat: 3  # Number of cycles to repeat

